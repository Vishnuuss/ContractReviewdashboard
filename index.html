<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LegalOS by AntiGravity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@100..900&family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- Custom Cursor (Disabled on mobile) -->
  <div id="cursor-ring"></div>
  <div id="cursor-dot"></div>

  <!-- Background Canvas -->
  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="scanline"></div>

  <!-- Main Layout -->
  <div id="app-layout">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <i data-lucide="hexagon" class="logo-icon"></i>
        <span class="logo-text">LEGALOS</span>
      </div>
      
      <div class="nav-section" style="margin-top: 0; display: flex; flex-direction: column; height: 100%;">
        <div class="nav-divider">CORE</div>
        <a href="#dashboard" class="nav-item active with-ripple" data-page="dashboard">
          <i data-lucide="bar-chart-2"></i>
          <span>Dashboard</span>
        </a>
        <a href="#contracts" class="nav-item with-ripple" data-page="contracts">
          <i data-lucide="file-text"></i>
          <span>Library & Upload</span>
        </a>
        <a href="#flags" class="nav-item with-ripple" data-page="flags">
          <i data-lucide="alert-triangle"></i>
          <span>Risk Desk</span>
          <span class="badge red-badge" id="nav-flags-badge">18</span>
        </a>
        <a href="#pipeline" class="nav-item with-ripple" data-page="pipeline">
          <i data-lucide="git-merge"></i>
          <span>Pipeline Log</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="user-avatar">VK</div>
        <div class="user-info">
          <div class="user-name">Vishnu K.</div>
          <div class="user-role">Managing Director</div>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- Topbar -->
      <header id="topbar">
        <h1 class="page-title" id="page-title">Overview</h1>
        <div class="topbar-right" style="margin-left: auto;">
          <div class="status-chip success">ALL SYSTEMS GO</div>
        </div>
      </header>

      <!-- Pages Container -->
      <div id="pages-container">
        <!-- Pages will be injected by main.js -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
