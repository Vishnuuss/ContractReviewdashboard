<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AIRA CIE — Contract Intelligence Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@100..900&family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- Cinematic Intro -->
  <div id="intro-screen">
    <div class="intro-door intro-door-top"></div>
    <div class="intro-door intro-door-bottom"></div>
    <div class="intro-content">
      <div class="analytical-ring">
        <i data-lucide="shield" class="intro-logo"></i>
      </div>
      <div class="intro-text">AIRA<span style="font-weight:300; color:#fff;"> CIE</span></div>
      <div class="intro-terminal">
        <div class="term-line">Loading 5 AI agents... [OK]</div>
        <div class="term-line">PII Redaction engine active... [OK]</div>
        <div class="term-line">Contract Intelligence Engine v2.0 <span class="term-blink">_</span></div>
      </div>
      <div class="intro-loader"></div>
    </div>
  </div>

  <!-- Custom Cursor (Disabled on mobile) -->
  <div id="cursor-ring"></div>
  <div id="cursor-dot"></div>

  <!-- Background Canvas -->
  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="scanline"></div>

  <!-- Main Layout -->
  <div id="app-layout">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <i data-lucide="shield" class="logo-icon"></i>
        <span class="logo-text">AIRA CIE</span>
      </div>
      
      <div class="nav-section" style="margin-top: 0; display: flex; flex-direction: column; height: 100%;">
        <div class="nav-divider">CORE</div>
        <a href="#dashboard" class="nav-item active with-ripple" data-page="dashboard">
          <i data-lucide="bar-chart-2"></i>
          <span>Dashboard</span>
        </a>
        <a href="#contracts" class="nav-item with-ripple" data-page="contracts">
          <i data-lucide="file-text"></i>
          <span>Library & Upload</span>
        </a>
        <a href="#flags" class="nav-item with-ripple" data-page="flags">
          <i data-lucide="alert-triangle"></i>
          <span>Risk Desk</span>
          <span class="badge red-badge" id="nav-flags-badge">18</span>
        </a>
        <a href="#pipeline" class="nav-item with-ripple" data-page="pipeline">
          <i data-lucide="git-merge"></i>
          <span>Pipeline Log</span>
        </a>
        <a href="#notifications" class="nav-item with-ripple" data-page="notifications">
          <i data-lucide="bell"></i>
          <span>Notifications</span>
          <span class="badge red-badge">3</span>
        </a>
        <a href="#settings" class="nav-item with-ripple" data-page="settings">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="user-avatar">VK</div>
        <div class="user-info">
          <div class="user-name">Vishnu K.</div>
          <div class="user-role">Managing Director</div>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- Topbar -->
      <header id="topbar">
        <h1 class="page-title" id="page-title">Overview</h1>
        
        <div class="search-container" id="search-container">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="global-search" placeholder="Search companies or contracts..." autocomplete="off">
          <div class="search-dropdown" id="search-dropdown">
            <!-- Search results injected here -->
          </div>
        </div>

        <div class="topbar-right">
          <div class="status-chip success">ENGINE v2.0 ● ONLINE</div>
        </div>
      </header>

      <!-- Pages Container -->
      <div id="pages-container">
        <!-- Pages will be injected by main.js -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Contract Detail Modal -->
  <div class="modal-overlay hidden" id="company-modal">
    <div class="modal-content tap-anim">
      <div class="modal-header">
        <h2 id="modal-company-name" style="font-family:var(--font-display); font-weight:800;">Company</h2>
        <button id="close-modal" class="icon-btn with-ripple"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Contract ID</label>
            <div id="modal-contract-id" class="mono-text">CIE-XXX</div>
          </div>
          <div class="form-group">
            <label>Document Type</label>
            <div id="modal-contract-type" style="color:#fff;">Type</div>
          </div>
          <div class="form-group">
            <label>Risk Score</label>
            <div id="modal-risk-score" style="color:var(--color-warning); font-size:28px; font-weight:700;">0</div>
          </div>
          <div class="form-group">
            <label>Recommendation</label>
            <div id="modal-recommendation" style="color:#fff; font-weight:700;">Pending</div>
          </div>
        </div>
        <div style="display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;">
          <button class="btn-primary with-ripple tap-anim" style="flex:1; min-width:140px;" onclick="window.downloadReport()">📄 Download Report</button>
          <button class="btn-primary with-ripple tap-anim" style="flex:1; min-width:140px; background:var(--color-success);" onclick="window.updateContractStatus(document.getElementById('modal-contract-id').textContent, 'Approved'); document.getElementById('company-modal').classList.add('hidden'); window.showToast('Contract approved','success');">✅ Approve</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
          <button class="btn-primary with-ripple tap-anim" style="flex:1; min-width:140px; background:var(--color-warning);" onclick="window.escalateContract(document.getElementById('modal-contract-id').textContent); document.getElementById('company-modal').classList.add('hidden');">⬆ Escalate to Counsel</button>
          <button class="btn-primary with-ripple tap-anim" style="flex:1; min-width:140px; background:var(--color-danger);" onclick="window.updateContractStatus(document.getElementById('modal-contract-id').textContent, 'Rejected'); document.getElementById('company-modal').classList.add('hidden'); window.showToast('Contract rejected','error');">✗ Reject</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
